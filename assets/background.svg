<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0f1419" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#121824" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1f2e" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9f9f" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#4a9f9f" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#4a9f9f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a47a" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#c4a47a" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#c4a47a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-deep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a7f7f" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#3a7f7f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a7f7f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a121a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a121a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080e16" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Dasar gelap -->
  <rect width="100%" height="100%" fill="#0f1419"/>
  <rect width="100%" height="100%" fill="url(#mesh)"/>

  <!-- Glow melayang (subtle, tidak ganggu baca teks) -->
  <circle cx="300" cy="250" r="450" fill="url(#glow-teal)"/>
  <circle cx="1650" cy="850" r="550" fill="url(#glow-gold)"/>
  <circle cx="980" cy="120" r="400" fill="url(#glow-deep)"/>
  <circle cx="1400" cy="200" r="300" fill="url(#glow-teal)" opacity="0.6"/>

  <!-- Halus-kan bawah agar teks hero kontras -->
  <rect width="100%" height="100%" fill="url(#fade)"/>
</svg>
